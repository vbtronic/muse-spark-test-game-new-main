<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>B-52 STRIKE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#000;overflow:hidden;font-family:'Orbitron',sans-serif}
canvas{display:block;background:linear-gradient(180deg,#000428 0%,#004e92 100%)}
#ui{position:absolute;top:20px;width:100%;display:flex;justify-content:space-between;padding:0 30px;color:#00ffaa;font-size:24px;font-weight:900;text-shadow:0 0 15px #00ffaa}
#lives{display:flex;gap:5px}
.heart{font-size:28px;filter:drop-shadow(0 0 8px red)}
#joystick{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:160px;height:160px;background:radial-gradient(circle,rgba(0,255,170,0.1) 0%,transparent 70%);border:3px solid rgba(0,255,170,0.5);border-radius:50%;backdrop-filter:blur(10px)}
#stick{position:absolute;width:70px;height:70px;background:linear-gradient(135deg,#00ffaa,#0088ff);border-radius:50%;box-shadow:0 0 25px #00ffaa;top:45px;left:45px;transition:0.1s}
#fireBtn{position:absolute;bottom:60px;right:40px;width:130px;height:130px;background:radial-gradient(circle,#ff0044,#aa0000);border:4px solid #ff0044;border-radius:50%;color:white;font-size:22px;font-weight:900;box-shadow:0 0 30px #ff0044;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#gameover{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;display:none}
#gameover h1{font-size:60px;color:#ff0044;text-shadow:0 0 20px #ff0044;animation:glow 1s infinite}
#gameover p{font-size:24px;color:#00ffaa;margin-top:10px}
@keyframes glow{0%,100%{opacity:1}50%{opacity:0.5}}
.particle{position:absolute;border-radius:50%;pointer-events:none}
</style>
</head>
<body>
<div id="ui">
  <div id="lives"><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span></div>
  <div>SCORE: <span id="score">0</span></div>
</div>
<div id="joystick"><div id="stick"></div></div>
<button id="fireBtn">FIRE</button>
<div id="gameover"><h1>GAME OVER</h1><p>Skóre: <span id="finalScore">0</span></p></div>
<canvas id="game"></canvas>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let player={x:canvas.width/2,y:canvas.height-120,speed:8};
let bullets=[];let drones=[];let particles=[];let stars=[];let explosions=[];
let moveDir=0;let shooting=false;let lives=3;let score=0;let gameActive=true;

// HVĚZDNÉ POLE
for(let i=0;i<150;i++)stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,s:Math.random()*3,v:Math.random()*0.5+0.2});

// OVLÁDÁNÍ - POUZE DOLEVA/DOPRAVA
const joy=document.getElementById('joystick');
const stick=document.getElementById('stick');
joy.addEventListener('touchmove',e=>{
  let t=e.touches[0];let r=joy.getBoundingClientRect();
  let dx=t.clientX-r.left-80;
  let dist=Math.min(45,Math.abs(dx));
  stick.style.left=(45+Math.sign(dx)*dist)+'px';
  moveDir=Math.sign(dx);
});
joy.addEventListener('touchend',()=>{moveDir=0;stick.style.left='45px'});

// STŘELBA
document.getElementById('fireBtn').addEventListener('touchstart',()=>shooting=true);
document.getElementById('fireBtn').addEventListener('touchend',()=>shooting=false
